<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUNJAB · Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ══ DA douce (même DA que la caisse) : gris clair, cartes très arrondies,
       sans bordure ; couleurs réservées aux états (appel, en cours, prêt, piment).
       Suit le thème clair / sombre de l'appareil. ══ */
    :root {
      color-scheme: light dark;
      --fond: #eeeef0; --carte: #e1e1e4; --carte-2: #d4d4d8; --clair: #f7f7f8;
      --texte: #1c1c1e; --texte-2: #58585e;
      --noir: #1c1c1e; --sur-noir: #ffffff;
      --rouge: #b3261e; --rouge-fond: #f6dcda;
      --ambre: #7a4f00; --ambre-fond: #f3ead6; --ambre-vif: #e8a317;
      --vert: #1a6b35; --vert-fond: #dcefe2; --vert-vif: #34c759;
      --bleu: #1554b3; --bleu-fond: #dbe7fb; --bleu-vif: #1d6fe0;
      --sur-vif: #1c1c1e;   /* texte sur ambre / vert vifs (≥ 7:1) */
      --vert-pose: #dcefe2; --sur-vert: #ffffff;   /* section servie / prête, texte sur vert plein */
      --rouge-plein: #c5221f;   /* allergie : texte blanc dessus à 5,8:1 */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #111113; --carte: #1e1e21; --carte-2: #34343a; --clair: #29292d;
        --texte: #f2f2f4; --texte-2: #a4a4aa;
        --noir: #f2f2f4; --sur-noir: #111113;
        --rouge: #ff8a80; --rouge-fond: #3a1d1b;
        --ambre: #f0c46a; --ambre-fond: #2e2717;
        --vert: #7fd69a; --vert-fond: #17301f;
        --bleu: #8fb8ff; --bleu-fond: #16243a;
        --vert-pose: #1c3a26; --sur-vert: #111113;   /* un cran plus clair que la carte */
        --rouge-plein: #dc3328;   /* texte blanc à 4,6:1, et 3,1:1 au moins sur les fonds sombres */
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--fond); color: var(--texte);
      font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
    }

    /* ── En-tête ── */
    header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 20px; background: var(--fond);
    }
    .header-left { display: flex; flex-direction: column; gap: 2px; }
    header h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.04em; }
    #counter { font-size: 14px; font-weight: 500; color: var(--texte-2); }
    #status {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px;
      border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap;
    }
    #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
    #status.connected    { background: var(--vert-fond);  color: var(--vert); }
    #status.connected::before { background: var(--vert); }
    #status.disconnected { background: var(--rouge-fond); color: var(--rouge); }
    #status.disconnected::before { background: var(--rouge); }

    /* ── Aucune commande ── */
    #empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      height: calc(100vh - 80px); color: var(--texte-2); font-size: 18px; font-weight: 500;
    }

    /* ── Grille ── */
    #orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding: 4px 16px 20px; }
    @media (min-width: 768px) {
      #orders { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 4px 20px 24px; }
    }

    /* ── Carte d'une commande ── */
    .order-card {
      background: var(--carte); border-radius: 24px; overflow: hidden;
      display: flex; flex-direction: column;
      animation: spring-in 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes spring-in { from { transform: scale(0.94) translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes spring-out { to { transform: scale(0.9); opacity: 0; } }
    .order-card.removing { animation: spring-out 0.22s ease forwards; }

    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 16px 18px 10px; }
    .table-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .table-label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--texte-2); }
    .table-num { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
    .order-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
    .order-num { font-size: 14px; font-weight: 500; color: var(--texte-2); }

    /* ── Articles ── */
    .item-row { display: flex; align-items: flex-start; gap: 10px; }
    .item-qty {
      flex-shrink: 0; min-width: 40px; padding: 3px 8px; border-radius: 10px; text-align: center;
      background: var(--carte); color: var(--texte); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .item-name { font-size: 20px; font-weight: 500; line-height: 1.25; color: var(--texte); overflow-wrap: anywhere; }
    .item-detail { display: block; margin-top: 1px; font-size: 16px; font-weight: 500; color: var(--texte-2); }
    /* piment comme sur le ticket : + / ++ / +++ */
    .item-piment {
      display: inline-block; margin-left: 8px; padding: 0 9px; border-radius: 999px; vertical-align: 2px;
      background: var(--rouge-fond); color: var(--rouge); font-size: 16px; font-weight: 800; letter-spacing: 1px;
    }
    /* note de la caisse (« Sans oignon ») : pastille grise sous le plat */
    .item-note {
      display: block; width: fit-content; max-width: 100%; margin-top: 5px; padding: 2px 9px; border-radius: 8px;
      background: var(--carte); color: var(--texte); font-size: 17px; font-weight: 600;
    }
    /* allergie : bloc rouge plein, blanc, en majuscules ; on sait à qui porter l'assiette */
    .item-allergie {
      display: block; width: fit-content; max-width: 100%; margin-top: 5px; padding: 3px 9px; border-radius: 8px;
      background: var(--rouge-plein); color: #fff; font-size: 17px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase;
    }
    /* en-tête de carte : au moins un plat de la table porte une allergie */
    .badge-allergie {
      padding: 4px 12px; border-radius: 999px; white-space: nowrap;
      background: var(--rouge-plein); color: #fff; font-size: 14px; font-weight: 800; letter-spacing: 0.04em;
    }

    /* ── À emporter ── */
    .emporter-card-header { background: var(--ambre-fond); padding-bottom: 14px; margin-bottom: 10px; }
    .emporter-label { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ambre); }
    .emporter-num { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; color: var(--ambre); }
    .emporter-client { margin-top: 4px; font-size: 16px; font-weight: 600; color: var(--texte); }
    .emporter-phone { font-size: 14px; color: var(--texte-2); }
    .emporter-retrait {
      display: inline-block; align-self: flex-start; margin-top: 6px; padding: 4px 12px; border-radius: 999px;
      background: var(--ambre-vif); color: var(--sur-vif); font-size: 16px; font-weight: 700;
    }

    /* ── Écran service : boutons de l'en-tête ── */
    .entete-actions { display: flex; align-items: center; gap: 8px; }
    .btn-entete {
      height: 40px; padding: 0 16px; border: none; border-radius: 999px; cursor: pointer;
      font: inherit; font-size: 15px; font-weight: 600;
    }
    .btn-commande { background: var(--noir); color: var(--sur-noir); }
    .btn-rafraichir { width: 40px; padding: 0; background: var(--carte); color: var(--texte); font-size: 18px; }

    /* ── Fenêtre « Nouvelle commande » (la caisse dans l'écran) ── */
    /* plein écran : la caisse garde sa mise en page tablette (panier à droite) */
    .modal-commande { position: fixed; inset: 0; z-index: 1000; background: var(--fond); }
    .modal-panneau { display: flex; flex-direction: column; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: var(--fond); }
    .modal-entete { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 6px 20px; flex-shrink: 0; }
    .modal-titre { font-size: 20px; font-weight: 600; }
    .modal-fermer {
      display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: none; border-radius: 999px; cursor: pointer;
      background: var(--noir); color: var(--sur-noir); font: inherit; font-size: 15px; font-weight: 600;
    }
    .modal-panneau iframe { flex: 1; width: 100%; border: none; }

    /* ── Sections ── */
    .card-body { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 0 10px 10px; }
    .cat-section { border-radius: 18px; overflow: hidden; background: var(--clair); transition: opacity 0.3s ease; }
    .cat-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px 4px; }
    .cat-label { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--texte-2); }
    .cat-items { display: flex; flex-direction: column; gap: 7px; padding: 4px 14px 12px; }
    .card-body .item-name { font-size: 17px; }
    .card-body .item-detail { font-size: 15px; }
    .card-body .item-qty { font-size: 15px; min-width: 36px; }
    .card-body .item-note, .card-body .item-allergie { font-size: 15px; }

    /* état de la section */
    .cat-status-pill { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .cat-status-pill.waiting     { background: var(--carte); color: var(--texte-2); }
    .cat-status-pill.called      { background: var(--bleu-fond); color: var(--bleu); }
    .cat-status-pill.in_progress { background: var(--ambre-fond); color: var(--ambre); }
    .cat-status-pill.done        { background: var(--vert-fond); color: var(--vert); }
    .cat-status-pill.delivered   { background: var(--carte); color: var(--texte-2); }
    .cat-timer {
      padding: 3px 10px; border-radius: 999px; background: var(--carte); color: var(--texte);
      font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .cat-timer.ready { background: var(--vert-fond); color: var(--vert); }

    /* prête en cuisine : clignote en vert jusqu'à la livraison */
    @keyframes pulse-done {
      0%, 49%, 100% { background: var(--vert-vif); color: var(--sur-vif); }
      50%, 99%      { background: var(--clair); color: var(--texte); }
    }
    .cat-section.done { animation: pulse-done 0.6s steps(1) infinite; cursor: pointer; }
    .cat-section.done .cat-label, .cat-section.done .item-name, .cat-section.done .item-detail { color: inherit; }
    .cat-section.done .item-qty { background: rgba(127,127,127,0.25); color: inherit; }
    .cat-section.delivered { opacity: 0.4; }

    /* bouton du bas de section */
    .btn-send { display: block; width: 100%; padding: 12px; text-align: center; font-size: 16px; font-weight: 600; letter-spacing: 0.01em; }
    .btn-send.waiting     { background: var(--noir); color: var(--sur-noir); cursor: pointer; }
    .btn-send.called      { background: var(--bleu-fond); color: var(--bleu); cursor: default; }
    .btn-send.in_progress { background: var(--ambre-fond); color: var(--ambre); }
    .btn-send.done        { background: var(--noir); color: var(--sur-noir); font-weight: 700; cursor: pointer; }
    .btn-send.delivered   { background: transparent; color: var(--vert); cursor: default; }

    .btn-delete {
      width: 100%; min-height: 44px; margin-top: 2px; border: none; border-radius: 999px; cursor: pointer;
      background: transparent; color: var(--rouge); font: inherit; font-size: 15px; font-weight: 600;
    }
    .btn-delete:hover { background: var(--rouge-fond); }

    /* ── À emporter ── */
    .emporter-all-items { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 18px; background: var(--clair); }
    .emporter-attente { padding: 4px 14px; font-size: 15px; font-weight: 500; color: var(--texte-2); }
    .emporter-pret-ligne { padding: 2px 4px; }
    .emporter-pret-badge {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      background: var(--vert-vif); color: var(--sur-vif); font-size: 15px; font-weight: 700;
    }
    .emporter-recupere-btn {
      width: 100%; min-height: 52px; margin-top: 4px; border: none; border-radius: 999px; cursor: pointer;
      background: var(--noir); color: var(--sur-noir); font: inherit; font-size: 17px; font-weight: 700;
    }
    /* boutons d'en-tête à 44 px */
    .btn-entete { height: 44px; flex-shrink: 0; white-space: nowrap; }
    .btn-rafraichir { width: 44px; }
    /* section livrée : fond vert pâle, pastille et bandeau vert plein « Livré ✓ »,
       visible en clair comme en sombre (fixe, alors que « Prêt » clignote) */
    .cat-section.delivered { opacity: 1; background: var(--vert-pose); }
    .cat-section.delivered .cat-label { color: var(--vert); }
    .cat-section.delivered .item-name, .cat-section.delivered .item-detail { color: var(--texte-2); }
    .cat-section.delivered .item-qty { background: transparent; color: var(--texte-2); }
    /* la note s'efface avec le plat servi ; l'allergie reste en rouge plein */
    .cat-section.delivered .item-note, .emporter-remis .item-note { color: var(--texte-2); }
    .cat-status-pill.delivered { background: var(--vert); color: var(--sur-vert); }
    .btn-send.delivered { background: var(--vert); color: var(--sur-vert); font-weight: 700; }
    .emporter-remis { background: var(--vert-pose); }
    .emporter-remis .item-name, .emporter-remis .item-detail { color: var(--texte-2); }
    .emporter-remis .item-qty { background: transparent; color: var(--texte-2); }
    .emporter-pret-ligne .cat-status-pill.delivered { display: inline-block; padding: 6px 14px; font-size: 15px; font-weight: 700; }
    /* téléphone : l'en-tête tient sur une ligne, « Connecté » devient un point */
    @media (max-width: 480px) {
      header { padding: 12px 16px; gap: 8px; }
      header h1 { font-size: 18px; }
      #counter { white-space: nowrap; }
      .btn-entete { padding: 0 14px; }
      .btn-rafraichir { padding: 0; }
      #status { font-size: 0; gap: 0; padding: 0; width: 44px; height: 44px; justify-content: center; }
      #status::before { width: 12px; height: 12px; }
    }
    /* appui refusé hors connexion : la pastille « Déconnecté » se signale */
    #status.secoue { animation: secoue 0.4s ease; }
    @keyframes secoue { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    /* Nouvelle mise à jour : bandeau en bas, il reste jusqu'à ce qu'on touche
       « Recharger » (jamais de rechargement automatique en plein service) */
    .maj-bandeau {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 500;
      display: flex; align-items: center; gap: 14px; width: max-content; max-width: calc(100vw - 32px);
      padding: 10px 10px 10px 20px; border-radius: 999px;
      background: var(--noir); color: var(--sur-noir); box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      font-size: 17px; font-weight: 700;
    }
    .maj-bandeau[hidden] { display: none; }
    .maj-bandeau button {
      min-height: 44px; padding: 0 20px; border: none; border-radius: 999px; cursor: pointer;
      background: var(--sur-noir); color: var(--noir); font: inherit; font-size: 17px; font-weight: 700;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>SERVICE</h1>
    <div id="counter">0 table(s)</div>
  </div>
  <div class="entete-actions">
    <button class="btn-entete btn-commande" onclick="openOrderApp()" title="Nouvelle commande">+ Commande</button>
    <button class="btn-entete btn-rafraichir" onclick="location.reload()" title="Rafraîchir" aria-label="Rafraîchir">↺</button>
    <div id="status" class="disconnected">Déconnecté</div>
  </div>
</header>

<!-- Popup app de commande -->
<div id="order-modal" class="modal-commande" style="display:none;">
  <div class="modal-panneau">
    <div class="modal-entete">
      <span class="modal-titre">Nouvelle commande</span>
      <button class="modal-fermer" onclick="closeOrderApp()">✕ Fermer</button>
    </div>
    <iframe id="order-iframe" title="Caisse"></iframe>
  </div>
</div>

<div id="empty">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
  Aucune commande en cours
</div>

<div id="orders"></div>

<script>
  const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/kds-ws";
  const ordersEl = document.getElementById("orders");
  const emptyEl  = document.getElementById("empty");
  const statusEl = document.getElementById("status");
  const counterEl = document.getElementById("counter");

  const orders = new Map();
  let ws;
  let pingInterval;

  // La caisse affichée par « + Commande » : la vraie en production, la caisse
  // d'essai (même machine, port 5173) quand le serveur d'impression tourne en
  // essai — sinon un test local passerait de vraies commandes
  const CAISSE_PROD = "https://punjab-restaurant.vercel.app";
  fetch("/mode").then((r) => r.json()).catch(() => ({ essai: false })).then((m) => {
    document.getElementById("order-iframe").src = m && m.essai
      ? `http://${location.hostname}:5173/` : CAISSE_PROD;
  });

  function openOrderApp() {
    const modal = document.getElementById("order-modal");
    modal.style.display = "flex";
  }
  function closeOrderApp() {
    document.getElementById("order-modal").style.display = "none";
  }
  // Échap ferme aussi la fenêtre
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.getElementById("order-modal").style.display !== "none") closeOrderApp();
  });
  // Fermer en cliquant en dehors
  document.getElementById("order-modal").addEventListener("click", function(e) {
    if (e.target === this) closeOrderApp();
  });

  // Même ordre que les tickets, l'écran cuisine et le serveur
  const CAT_ORDER = ["Naans", "Entrees", "Plats", "Desserts", "Boissons", "Menu Midi"];
  const CAT_LABELS = { Entrees: "Entrées", Plats: "Plats", Naans: "Naans", Desserts: "Desserts", Boissons: "Boissons", "Menu Midi": "Menu Midi" };
  const CAT_MERGE = { "Biryani": "Plats", "Entrées": "Entrees", "Entrees": "Entrees" };

  const FORMULA_LABEL_MAP = {
    "entree": "Entrees", "entrees": "Entrees",
    "plat": "Plats", "plats": "Plats",
    "dessert": "Desserts", "desserts": "Desserts",
    "naan": "Naans", "naans": "Naans",
    "boisson": "Boissons", "boissons": "Boissons",
  };
  function mapFormulaLabel(label) {
    const key = label.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    return FORMULA_LABEL_MAP[key] || label;
  }
  function normName(s) {
    return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\u0153/g, "oe").replace(/\u0152/g, "Oe").replace(/\u00e6/g, "ae").replace(/\u00c6/g, "Ae").toLowerCase();
  }
  // Piment comme sur le ticket : 2 = +, 3 = ++, 4 = +++ (1 = sans, rien)
  const PIMENT_MARKS = { 2: "+", 3: "++", 4: "+++" };
  function pimentHtml(level) {
    const m = PIMENT_MARKS[level];
    return m ? `<span class="item-piment" title="Piment">${m}</span>` : "";
  }

  // Les textes des commandes (noms, notes, allergies, client) sont tapés à la
  // caisse : échappés avant d'entrer dans le HTML de l'écran
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }
  // Note et allergie d'un article ou d'un choix de menu (absentes quand vides,
  // comme dans le panier)
  function noteEtAllergie(src) {
    const r = {};
    if (src && src.note) r.note = src.note;
    if (src && src.allergie) r.allergie = src.allergie;
    return r;
  }
  // Deux articles ne se regroupent que s'ils sont pareils pour la cuisine :
  // même nom, même piment, même note, même allergie
  function cleArticle(nom, a) {
    const n = (s) => normName(s).replace(/\s+/g, " ").trim();
    return [n(nom), a.piment || 0, n(a.note), n(a.allergie)].join("|");
  }
  // Une ligne d'article, la même partout : quantité, nom, piment, précision,
  // puis la note (pastille grise) et l'allergie (bloc rouge plein)
  function ligneArticle(i) {
    return `<div class="item-row"><span class="item-qty">${esc(i.qty)}×</span><span class="item-name">${esc(i.name)}${pimentHtml(i.piment)}`
      + (i.detail ? `<span class="item-detail">${esc(i.detail)}</span>` : "")
      + (i.note ? `<span class="item-note">${esc(i.note)}</span>` : "")
      + (i.allergie ? `<span class="item-allergie">⚠&#xFE0E; Allergie ${esc(i.allergie)}</span>` : "")
      + `</span></div>`;
  }
  const BADGE_ALLERGIE = `<span class="badge-allergie">⚠&#xFE0E; ALLERGIE</span>`;
  const STATUS_LABELS = { waiting: "En attente", called: "Demandé…", in_progress: "En cours", done: "Prêt ✓", delivered: "Livré ✓" };
  const BTN_LABELS   = { waiting: "Appeler cuisine", called: "Demandé…", in_progress: "En cours…", done: "✓ Confirmer livraison", delivered: "Livré ✓" };

  function connect() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      verifierVersion();
      statusEl.textContent = "Connecté";
      statusEl.className = "connected";
      statusEl.title = "Connecté"; statusEl.setAttribute("aria-label", "Connecté");
      clearInterval(pingInterval);
      pingInterval = setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "ping" }));
        } else {
          clearInterval(pingInterval);
          connect();
        }
      }, 10000);
    };

    ws.onclose = () => {
      statusEl.textContent = "Déconnecté";
      statusEl.className = "disconnected";
      statusEl.title = "Déconnecté"; statusEl.setAttribute("aria-label", "Déconnecté");
      clearInterval(pingInterval);
      setTimeout(connect, 1000);
    };

    ws.onerror = () => { ws.close(); };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        // une commande déjà affichée (renvoyée à la reconnexion, ou modifiée)
        // est refaite à sa place au lieu d'être ignorée
        if (msg.type === "new_order")    remplacerCommande(msg.order, false);
        if (msg.type === "update_order") remplacerCommande(msg.order, true);
        if (msg.type === "order_ready")  removeOrder(msg.orderId);
        if (msg.type === "cat_status")   updateCatStatus(msg.orderId, msg.catName, msg.status, msg);
        // fin de l'envoi complet du serveur : ce qu'il ne connaît plus a été
        // terminé ou supprimé pendant une coupure
        if (msg.type === "etat_complet") {
          const garder = new Set(msg.ids || []);
          for (const id of [...orders.keys()]) if (!garder.has(id)) removeOrder(id);
        }
      } catch (err) {
        console.error("WS message error:", err.message);
      }
    };
  }

  // Boissons, vins, apéritifs, bières… : préparés par le bar, pas par la cuisine
  const CAT_NO_KITCHEN = ["Boissons", "Vins", "Vin", "Rosé", "Rose", "Apéritifs", "Aperitifs", "Bières", "Bieres", "Bar"];

  // Envoi au serveur. Hors connexion, l'appui est refusé et la pastille
  // « Déconnecté » se signale, au lieu d'un appui perdu en silence.
  function envoyer(msg) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      statusEl.classList.remove("secoue");
      void statusEl.offsetWidth;
      statusEl.classList.add("secoue");
      return false;
    }
    ws.send(JSON.stringify(msg));
    return true;
  }

  function sendServiceCall(orderId, catName) {
    if (CAT_NO_KITCHEN.includes(catName)) {
      // Boissons : passe directement en in_progress (bar gère sans cuisine)
      envoyer({ type: "cat_in_progress", orderId, catName });
    } else {
      envoyer({ type: "service_call", orderId, catName });
    }
  }

  // « Marquer servi » : le serveur a servi les boissons lui-même, c'est livré
  // (avant, la section repassait « prête » et attendait une 2e confirmation)
  function markBoissonsReady(orderId, catName) {
    markDelivered(orderId, catName);
  }

  function markDelivered(orderId, catName) {
    if (!envoyer({ type: "cat_delivered", orderId, catName })) return;
    updateCatStatus(orderId, catName, "delivered"); // mise à jour locale immédiate (l'order peut déjà être supprimé côté serveur)
  }

  async function deleteOrder(orderId) {
    if (!confirm("Supprimer cette commande ?")) return;
    try {
      await fetch(`/order/${encodeURIComponent(orderId)}`, { method: "DELETE" });
    } catch {}
  }

  // Éléments d'une section (avec expansion des formules + agrégation)
  function articlesDeSection(order, cat) {
    const catItemsMap = {};
    // Sections calculees par le serveur (memes noms que catStatus) quand la
    // commande en porte ; sinon l'ancien calcul pour les commandes deja ouvertes.
    // La note et l'allergie sont recopiées : sans elles, la salle ne voit rien.
    const groupe = (order.groupes || []).find((g) => g.cat === cat);
    if (groupe) {
      groupe.items.forEach((i, n) => {
        catItemsMap[n] = { name: i.name, detail: i.detail || "", qty: i.qty, piment: i.piment || null, ...noteEtAllergie(i) };
      });
    }
    for (const i of (order.groupes ? [] : (order.items || []))) {
      if (i.formulaChoices && i.formulaChoices.length > 0) {
        for (const choice of i.formulaChoices) {
          const choiceCat = CAT_MERGE[mapFormulaLabel(choice.label)] || mapFormulaLabel(choice.label);
          if (choiceCat !== cat) continue;
          const key = cleArticle(choice.itemName, choice);
          if (catItemsMap[key]) catItemsMap[key].qty += i.qty;
          else catItemsMap[key] = { name: choice.itemName, qty: i.qty, piment: choice.piment || null, ...noteEtAllergie(choice) };
        }
      } else {
        // « poste » : section du ticket choisie dans l'admin pour la categorie
        const itemCat = i.poste || CAT_MERGE[i.category] || i.category;
        if (itemCat !== cat) continue;
        const key = cleArticle(i.name, i);
        if (catItemsMap[key]) catItemsMap[key].qty += i.qty;
        else catItemsMap[key] = { name: i.name, qty: i.qty, piment: i.piment || null, ...noteEtAllergie(i) };
      }
    }
    return Object.values(catItemsMap);
  }

  function buildCatSection(order, cat, status) {
    const label    = CAT_LABELS[cat] || cat;
    const catKey   = cat.replace(/\s/g, '_');
    const oid      = order.id;
    const noKitchen = CAT_NO_KITCHEN.includes(cat);

    const itemsHtml = articlesDeSection(order, cat).map(ligneArticle).join("");

    // Onclick sur la section entière
    let onclickAttr = "";
    if (status === "waiting") {
      onclickAttr = `onclick="sendServiceCall('${oid}','${cat}')" style="cursor:pointer;"`;
    } else if (status === "in_progress" && noKitchen) {
      onclickAttr = `onclick="markBoissonsReady('${oid}','${cat}')" style="cursor:pointer;"`;
    } else if (status === "done") {
      onclickAttr = `onclick="markDelivered('${oid}','${cat}')" style="cursor:pointer;"`;
    }

    // Timers
    const showCallTimer  = status === "called" || status === "in_progress";
    const showReadyTimer = status === "done";

    // Label du bouton
    let btnLabel;
    if (noKitchen) {
      btnLabel = { waiting: "Servir", in_progress: "Marquer servi", done: "✓ Confirmer livraison", delivered: "Livré ✓" }[status] || status;
    } else {
      btnLabel = BTN_LABELS[status] || status;
    }

    // Classe section
    const sectionClass = status === "done" ? "done" : status === "delivered" ? "delivered" : "";

    return `<div class="cat-section ${sectionClass}" id="cat-row-${oid}-${catKey}" ${onclickAttr}>
        <div class="cat-header">
          <span class="cat-label">${esc(label)}</span>
          <div style="display:flex;align-items:center;gap:5px;">
            ${showCallTimer  ? `<span class="cat-timer" id="svc-cat-timer-${oid}-${catKey}">0s</span>` : ""}
            ${showReadyTimer ? `<span class="cat-timer ready" id="svc-ready-timer-${oid}-${catKey}">0s</span>` : ""}
            <span class="cat-status-pill ${status}">${STATUS_LABELS[status] || status}</span>
          </div>
        </div>
        <div class="cat-items">${itemsHtml}</div>
        <div class="btn-send ${noKitchen && status === "in_progress" ? "waiting" : status}">${btnLabel}</div>
      </div>`;
  }

  function buildCatRows(order) {
    const catStatus = order.catStatus || {};
    const cats = Object.keys(catStatus);
    const ordre = order.groupes ? order.groupes.map((g) => g.cat) : CAT_ORDER;
    const sorted = [...ordre.filter(c => cats.includes(c)), ...cats.filter(c => !ordre.includes(c))];
    return sorted.map(cat => buildCatSection(order, cat, catStatus[cat] || "waiting")).join("");
  }

  function buildEmporterItems(order) {
    if (order.groupes) return order.groupes.flatMap((g) => g.items);
    // (même nom mais autre piment, autre note ou autre allergie : deux lignes)
    const flat = {};
    for (const i of (order.items || [])) {
      if (i.formulaChoices && i.formulaChoices.length > 0) {
        for (const c of i.formulaChoices) {
          const k = cleArticle(c.itemName, c);
          if (flat[k]) flat[k].qty += i.qty;
          else flat[k] = { name: c.itemName, qty: i.qty, piment: c.piment || null, ...noteEtAllergie(c) };
        }
      } else {
        const k = cleArticle(i.name, i);
        if (flat[k]) flat[k].qty += i.qty;
        else flat[k] = { name: i.name, qty: i.qty, piment: i.piment || null, ...noteEtAllergie(i) };
      }
    }
    return Object.values(flat);
  }

  function buildEmporterSection(order) {
    const status = (order.catStatus || {})["A emporter"] || "waiting";
    const isDone = status === "done";
    const items = buildEmporterItems(order);
    const itemsHtml = items.map(ligneArticle).join("");
    if (status === "delivered") {
      return `<div class="emporter-all-items emporter-remis">${itemsHtml}</div>
        <div class="emporter-pret-ligne"><span class="cat-status-pill delivered">Remis au client ✓</span></div>`;
    }
    if (isDone) {
      return `<div class="emporter-all-items">${itemsHtml}</div>
        <div class="emporter-pret-ligne"><span class="emporter-pret-badge">✓ Prêt, à remettre au client</span></div>
        <button class="emporter-recupere-btn" onclick="markEmporterRecupere('${order.id}')">Remis au client ✓</button>`;
    }
    return `<div class="emporter-all-items">${itemsHtml}</div>
      <div class="emporter-attente">En attente cuisine…</div>`;
  }

  function markEmporterRecupere(orderId) {
    markDelivered(orderId, "A emporter");
  }

  function addOrder(order, place = null, anime = true) {
    if (orders.has(order.id)) return;
    const isEmporter = order.orderType === "emporter";
    const card = document.createElement("div");
    card.className = `order-card${isEmporter ? " emporter-card" : ""}`;
    card.id = `order-${order.id}`;
    if (!anime) card.style.animation = "none";
    const headerInfo = isEmporter
      ? `<div class="table-info">
          <div class="emporter-label">À EMPORTER</div>
          <div class="emporter-num">#${esc(order.emporterNum || order.tableNumber)}</div>
          ${order.clientName ? `<div class="emporter-client">${esc(order.clientName)}</div>` : ""}
          ${order.clientPhone ? `<div class="emporter-phone">${esc(order.clientPhone)}</div>` : ""}
          ${order.clientPickupTime ? `<div class="emporter-retrait">Retrait ${esc(order.clientPickupTime)}</div>` : ""}
        </div>`
      : `<div class="table-info">
          <div class="table-label">Table</div>
          <div class="table-num">${esc(order.tableNumber)}</div>
        </div>`;
    // un plat montré sur la carte porte une allergie : mêmes articles que ceux
    // affichés (sections de catStatus, ou bloc à emporter)
    const montres = isEmporter ? buildEmporterItems(order)
      : Object.keys(order.catStatus || {}).flatMap((cat) => articlesDeSection(order, cat));
    const allergie = montres.some((i) => i.allergie);
    card.innerHTML = `
      <div class="card-header${isEmporter ? " emporter-card-header" : ""}">
        ${headerInfo}
        <div class="order-meta">
          ${allergie ? BADGE_ALLERGIE : ""}
          <div class="order-num">#${esc(order.orderNum)}</div>
        </div>
      </div>
      <div class="card-body" id="body-${order.id}">
        ${isEmporter ? buildEmporterSection(order) : buildCatRows(order)}
        <button class="btn-delete" onclick="deleteOrder('${order.id}')">Supprimer la commande</button>
      </div>
    `;
    // une table modifiée garde sa place dans la grille
    if (place) place.replaceWith(card);
    else ordersEl.prepend(card);

    const catStartTimes = {};
    const catReadyTimes = {};
    // Restaurer les timers depuis catCalledAt / catReadyAt persistés
    const catStatus  = order.catStatus  || {};
    const catCalledAt = order.catCalledAt || {};
    const catReadyAt  = order.catReadyAt  || {};
    for (const [cat, st] of Object.entries(catStatus)) {
      if (st === "called" || st === "in_progress") {
        catStartTimes[cat] = catCalledAt[cat] ? Number(catCalledAt[cat]) : Date.now();
      }
      if (st === "done") {
        catReadyTimes[cat] = catReadyAt[cat] ? Number(catReadyAt[cat]) : Date.now();
      }
    }

    function tickSvc() {
      for (const [cat, startTime] of Object.entries(catStartTimes)) {
        const el = document.getElementById(`svc-cat-timer-${order.id}-${cat.replace(/\s/g,'_')}`);
        if (el) el.textContent = formatElapsed(Date.now() - Number(startTime));
      }
      for (const [cat, readyTime] of Object.entries(catReadyTimes)) {
        const el = document.getElementById(`svc-ready-timer-${order.id}-${cat.replace(/\s/g,'_')}`);
        if (el) el.textContent = formatElapsed(Date.now() - Number(readyTime));
      }
    }
    tickSvc(); // mise à jour immédiate
    const interval = setInterval(tickSvc, 1000);

    orders.set(order.id, { ...order, _catStartTimes: catStartTimes, _catReadyTimes: catReadyTimes, _interval: interval });
    updateCounter();
  }

  // Commande renvoyée par le serveur (modification, ou envoi complet à la
  // reconnexion) : la carte est refaite à la même place
  function remplacerCommande(order, anime) {
    const ancienne = orders.get(order.id);
    if (!ancienne) { addOrder(order); return; }
    if (ancienne._interval) clearInterval(ancienne._interval);
    orders.delete(order.id);
    const place = document.getElementById(`order-${order.id}`);
    if (place) {
      place.removeAttribute("id");
      place.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
    }
    addOrder(order, place, anime);
    updateCounter();
  }

  function formatElapsed(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const ss = s % 60;
    return m > 0 ? `${m}min ${ss < 10 ? "0" : ""}${ss}s` : `${ss}s`;
  }

  function updateCatStatus(orderId, catName, status, msg = {}) {
    const entry = orders.get(orderId);
    if (!entry) return;
    if (!entry.catStatus) entry.catStatus = {};
    entry.catStatus[catName] = status;
    const order = entry;

    // Timer de demande (called, ou in_progress pour Boissons)
    if ((status === "called" || (status === "in_progress" && CAT_NO_KITCHEN.includes(catName)))
        && entry._catStartTimes && !entry._catStartTimes[catName]) {
      entry._catStartTimes[catName] = msg.calledAt || Date.now();
    }

    // Cuisine a terminé → démarrer timer "prêt" (cuisine attend le service)
    if (status === "done") {
      if (entry._catReadyTimes) entry._catReadyTimes[catName] = msg.readyAt || Date.now();
      if (entry._catStartTimes) delete entry._catStartTimes[catName];
    }

    // Service confirme livraison → arrêter timer "prêt"
    if (status === "delivered") {
      if (entry._catReadyTimes) delete entry._catReadyTimes[catName];
      if (entry._catStartTimes) delete entry._catStartTimes[catName];
    }

    // Commande À EMPORTER : rafraîchir le bloc entier
    if (catName === "A emporter") {
      const body = document.getElementById(`body-${orderId}`);
      if (body) {
        const deleteBtn = body.querySelector(".btn-delete");
        const newSection = buildEmporterSection(order);
        // Retirer tout sauf le bouton supprimer
        while (body.firstChild && body.firstChild !== deleteBtn) body.removeChild(body.firstChild);
        deleteBtn.insertAdjacentHTML("beforebegin", newSection);
      }
      return;
    }

    const rowId = `cat-row-${orderId}-${catName.replace(/\s/g,'_')}`;
    const row = document.getElementById(rowId);
    if (!row) return;

    const newHtml = buildCatSection(order, catName, status);
    const tmp = document.createElement("div");
    tmp.innerHTML = newHtml;
    row.replaceWith(tmp.firstElementChild);
  }

  function removeOrder(orderId) {
    const entry = orders.get(orderId);
    if (entry && entry._interval) clearInterval(entry._interval);
    const card = document.getElementById(`order-${orderId}`);
    if (card) {
      // la carte qui part en fondu lâche ses id : une commande modifiée
      // (retirer puis remettre) ne doit pas viser l'ancienne carte
      card.removeAttribute("id");
      card.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
      card.classList.add("removing");
      setTimeout(() => card.remove(), 250);
    }
    orders.delete(orderId);
    updateCounter();
  }

  function updateCounter() {
    const n = orders.size;
    counterEl.textContent = `${n} table${n > 1 ? "s" : ""} en cours`;
    emptyEl.style.display = n === 0 ? "flex" : "none";
    ordersEl.style.display = n === 0 ? "none" : "grid";
  }

  updateCounter();
  // ── Nouvelle mise à jour ──
  // Le serveur d'impression donne sa version (GET /version). Si elle change
  // pendant que l'écran est ouvert, le bandeau s'affiche ; seul un appui sur
  // « Recharger » recharge la page, jamais l'écran tout seul.
  let versionEcran = null;
  async function verifierVersion() {
    try {
      const r = await fetch(`/version?t=${Date.now()}`, { cache: "no-store" });
      if (!r.ok) return;
      const { version } = await r.json();
      if (!version) return;
      if (versionEcran === null) versionEcran = version;
      else if (version !== versionEcran) document.getElementById("maj-bandeau").hidden = false;
    } catch { /* serveur injoignable : on réessaiera */ }
  }
  verifierVersion();
  setInterval(verifierVersion, 20000);

  connect();
</script>
  <div id="maj-bandeau" class="maj-bandeau" role="status" aria-live="polite" hidden>
    <span>Nouvelle mise à jour</span>
    <button type="button" onclick="location.reload()">Recharger</button>
  </div>
</body>
</html>
